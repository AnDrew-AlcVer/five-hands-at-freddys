<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balatro Clone</title>
    <link rel="stylesheet" href="/templates/css/base.css">
    <link rel="stylesheet" href="/templates/css/juego.css">
    <link rel="stylesheet" href="/templates/css/responsive.css">
</head>
<body>
    <div class="game-container">
        <!-- Menú Lateral -->
        <div class="sidebar">
            <div class="shop-section">
                <div class="shop-header">
                    <h2>TIENDA</h2>
                    <p>¡Mejora tu partida!</p>
                </div>
                
                <div class="round-info">
                    <div class="blind-target">
                        <span class="label">Apuesta objetivo</span>
                        <span class="target-score" id="blindTarget">300</span>
                    </div>
                    
                    <div class="round-score">
                        <span class="label">Puntuación de ronda</span>
                        <span class="score" id="roundScore">0</span>
                    </div>
                    
                    <div class="stats-row">
                        <div class="stat-item blue">
                            <span class="value" id="chipsValue">0</span>
                            <span class="label">Fichas</span>
                        </div>
                        <div class="mult-symbol">×</div>
                        <div class="stat-item red">
                            <span class="value" id="multValue">0</span>
                            <span class="label">Mult</span>
                        </div>
                    </div>
                    
                    <div class="hands-info">
                        <div class="info-item">
                            <span class="label">Manos</span>
                            <span class="value" id="handsValue">4</span>
                        </div>
                        <div class="divider"></div>
                        <div class="info-item">
                            <span class="label">Descartes</span>
                            <span class="value" id="discardsValue">4</span>
                        </div>
                    </div>
                    
                    <div class="money">
                        <span class="amount" id="moneyValue">$0</span>
                    </div>
                </div>
                
                <div class="menu-buttons">
                    <button class="menu-btn run-info">Info de Partida</button>
                    <button class="menu-btn options">Opciones</button>
                    <button class="menu-btn exit-game" id="exitGameBtn">Salir al Menú</button>
                </div>
            </div>
        </div>

        <!-- Área Principal del Juego -->
        <div class="main-game-area">
            <!-- Zona de Jokers en la parte superior -->
            <div class="jokers-area-top">
                <h3 class="jokers-title">JOKERS</h3>
                <div class="jokers-container">
                    <div class="joker-slot" data-joker="1">
                        <div class="joker-placeholder">
                            <div class="joker-icon">🃏</div>
                            <div class="joker-text">Slot 1</div>
                        </div>
                    </div>
                    <div class="joker-slot" data-joker="2">
                        <div class="joker-placeholder">
                            <div class="joker-icon">🃏</div>
                            <div class="joker-text">Slot 2</div>
                        </div>
                    </div>
                    <div class="joker-slot" data-joker="3">
                        <div class="joker-placeholder">
                            <div class="joker-icon">🃏</div>
                            <div class="joker-text">Slot 3</div>
                        </div>
                    </div>
                    <div class="joker-slot" data-joker="4">
                        <div class="joker-placeholder">
                            <div class="joker-icon">🃏</div>
                            <div class="joker-text">Slot 4</div>
                        </div>
                    </div>
                    <div class="joker-slot" data-joker="5">
                        <div class="joker-placeholder">
                            <div class="joker-icon">🃏</div>
                            <div class="joker-text">Slot 5</div>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Zona Central de Juego -->
            <div class="play-area">
                <div class="played-cards" id="playedCards">
                    <div class="play-area-placeholder">
                        <p>Selecciona cartas y haz clic en "JUGAR CARTAS"</p>
                        <p class="play-hint">Las cartas aparecerán aquí</p>
                    </div>
                </div>
            </div>
            
            <!-- Controles del Juego -->
            <div class="game-controls">
                <button id="playCardsBtn" class="play-button" disabled>
                    JUGAR CARTAS
                </button>
                <button id="discardBtn" class="discard-button">
                    DESCARTAR
                </button>
            </div>
            
            <!-- Cartas del Jugador -->
            <div class="player-hand-container">
                <div class="hand-info">
                    <span class="hand-label">Tu mano:</span>
                    <span class="selection-count" id="selectionCount">0/5 cartas seleccionadas</span>
                </div>
                <div class="player-hand" id="playerHand">
                    <!-- Las cartas se generarán dinámicamente -->
                </div>
            </div>
        </div>

        <!-- Información adicional -->
        <div class="right-panel">
            <div class="deck-info">
                <div class="deck-card">
                    <span class="deck-count">52/52</span>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/sesion.js') }}"></script>
    <script src="{{ url_for('static', filename='js/cartas.js') }}"></script>
    <script src="{{ url_for('static', filename='js/jokers.js') }}"></script>
    <script src="{{ url_for('static', filename='js/objetivos.js') }}"></script>
    <script src="{{ url_for('static', filename='js/accionesJuego.js') }}"></script>
    <script src="{{ url_for('static', filename='js/juego.js') }}"></script>
</body>
</html>
